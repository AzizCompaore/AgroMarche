{% extends 'core/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-success py-4 text-center text-white">
                    <i class="bi bi-person-circle display-4"></i>
                    <h2 class="fw-bold mt-2">Bon retour !</h2>
                    <p class="mb-0 opacity-75">Connectez-vous pour gérer vos stocks</p>
                </div>

                <div class="card-body p-4 p-lg-5">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} border-0 rounded-3 small">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-bold">Nom d'utilisateur</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-success"></i></span>
                                <input type="text" name="username" id="id_username" class="form-control border-start-0 bg-light" placeholder="Votre pseudo" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="id_password" class="form-label fw-bold">Mot de passe</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-success"></i></span>
                                <input type="password" name="password" id="id_password" class="form-control border-start-0 bg-light" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold shadow-sm py-3">
                                Se connecter
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Pas encore de compte ?</p>
                        <a href="{% url 'inscription' %}" class="text-success fw-bold text-decoration-none">Créer un compte gratuitement</a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="{% url 'home' %}" class="text-muted text-decoration-none small">
                    <i class="bi bi-house-door me-1"></i> Retour à l'accueil
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    body { background-color: #f8f9fa; }
    .form-control:focus {
        border-color: #198754;
        box-shadow: none;
        background-color: #fff;
    }
    .input-group-text {
        border-color: #dee2e6;
    }
</style>
{% endblock %}
